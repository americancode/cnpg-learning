apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: appdb-restore
  namespace: demo-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  imagePullPolicy: IfNotPresent
  enableSuperuserAccess: true
  superuserSecret:
    name: appdb-superuser
  bootstrap:
    recovery:
      source: appdb-source
      recoveryTarget:
        targetTime: "__TARGET_TIME__"
      database: app
      owner: app
      secret:
        name: appdb-app
  storage:
    size: 5Gi
  externalClusters:
    - name: appdb-source
      barmanObjectStore:
        serverName: appdb
        destinationPath: s3://cnpg-backups/appdb
        endpointURL: http://minio.demo-db.svc.cluster.local:9000
        s3Credentials:
          accessKeyId:
            name: minio-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: minio-creds
            key: ACCESS_SECRET_KEY
