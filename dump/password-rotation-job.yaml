apiVersion: v1
kind: ServiceAccount
metadata:
  name: crunchy-password-rotator
  namespace: crunchy-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crunchy-password-rotator
  namespace: crunchy-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - crunchy-demo-pguser-app
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crunchy-password-rotator
  namespace: crunchy-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
subjects:
  - kind: ServiceAccount
    name: crunchy-password-rotator
    namespace: crunchy-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crunchy-password-rotator
---
apiVersion: batch/v1
kind: Job
metadata:
  name: crunchy-demo-password-rotation-once
  namespace: crunchy-demo
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: crunchy-password-rotator
      restartPolicy: Never
      containers:
        - name: rotate-password
          image: docker.io/bitnami/kubectl:1.30.6
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_SECRET
              value: crunchy-demo-pguser-app
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 60); do
                if kubectl get secret "${TARGET_SECRET}" >/dev/null 2>&1; then
                  break
                fi

                if [ "${attempt}" = "60" ]; then
                  echo "timed out waiting for secret ${TARGET_SECRET}" >&2
                  exit 1
                fi

                sleep 10
              done

              password="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
              encoded_password="$(printf '%s' "${password}" | base64 | tr -d '\n')"
              rotated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

              kubectl patch secret "${TARGET_SECRET}" --type=merge -p \
                "{\"data\":{\"password\":\"${encoded_password}\"},\"metadata\":{\"annotations\":{\"password-rotation.argocd.example.com/rotated-at\":\"${rotated_at}\"}}}"

              echo "rotated password in secret ${TARGET_SECRET} at ${rotated_at}"
