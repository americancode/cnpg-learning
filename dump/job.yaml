apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: mc-config
          emptyDir: {}
      initContainers:
        - name: configure-alias
          image: cgr.dev/chainguard/minio-client:latest
          env:
            - name: MINIO_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: MC_CONFIG_DIR
              value: /mc-config
          volumeMounts:
            - name: mc-config
              mountPath: /mc-config
          command:
            - mc
          args:
            - alias
            - set
            - local
            - $(MINIO_ENDPOINT)
            - $(MINIO_ACCESS_KEY)
            - $(MINIO_SECRET_KEY)
        - name: wait-for-minio
          image: cgr.dev/chainguard/minio-client:latest
          env:
            - name: MC_CONFIG_DIR
              value: /mc-config
          volumeMounts:
            - name: mc-config
              mountPath: /mc-config
          command:
            - mc
          args:
            - ls
            - local
      containers:
        - name: create-buckets
          image: cgr.dev/chainguard/minio-client:latest
          env:
            - name: MC_CONFIG_DIR
              value: /mc-config
          volumeMounts:
            - name: mc-config
              mountPath: /mc-config
          command:
            - mc
          args:
            - mb
            - --ignore-existing
            - local/app-data
            - local/app-logs
            - local/app-backups