apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      volumes:
        - name: mc-config
          emptyDir: {}
      initContainers:
        # Use Chainguard curl for health checks; no shell required.
        - name: wait-for-minio
          image: cgchainguard/curl:latest
          command:
            - curl
          args:
            - --fail
            - --silent
            - --show-error
            - --retry
            - "60"
            - --retry-all-errors
            - --retry-delay
            - "2"
            - --retry-max-time
            - "120"
            - http://minio.minio.svc.cluster.local:9000/minio/health/live
        - name: configure-alias
          image: docker.io/minio/mc:latest
          env:
            - name: MINIO_ENDPOINT
              value: http://minio.minio.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: MC_CONFIG_DIR
              value: /mc-config
          volumeMounts:
            - name: mc-config
              mountPath: /mc-config
          command:
            - mc
          args:
            - alias
            - set
            - local
            - $(MINIO_ENDPOINT)
            - $(MINIO_ACCESS_KEY)
            - $(MINIO_SECRET_KEY)
      containers:
        - name: create-buckets
          image: docker.io/minio/mc:latest
          env:
            - name: MC_CONFIG_DIR
              value: /mc-config
          volumeMounts:
            - name: mc-config
              mountPath: /mc-config
          command:
            - mc
          args:
            - mb
            - --ignore-existing
            - local/app-data
            - local/app-logs
            - local/app-backups
