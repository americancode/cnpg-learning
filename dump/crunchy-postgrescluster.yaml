apiVersion: v1
kind: Namespace
metadata:
  name: crunchy-demo
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: crunchy-demo
  namespace: crunchy-demo
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  postgresVersion: 17
  users:
    - name: app
      databases:
        - app
  instances:
    - name: instance1
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
  backups:
    pgbackrest:
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
