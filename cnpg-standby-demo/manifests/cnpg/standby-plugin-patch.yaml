# The cnpg/cluster chart renders replica recovery through
# externalClusters[].barmanObjectStore, but it does not expose the
# plugin-based external cluster fields. This patch swaps the standby
# Cluster over to plugin-backed recovery and replay.
spec:
  bootstrap:
    recovery:
      source: appdb-east-source
      database: app
      owner: app
  replica:
    enabled: true
    source: appdb-east-source
  externalClusters:
    - name: appdb-east-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: appdb-east-source-store
          serverName: appdb-east
